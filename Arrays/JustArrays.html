<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Arrays</title>
</head>
<body>

    <script>
        var justArrays = new Array(
            ["Lexus", "BMW", "Mercedes", "Audi", "Tesla", "Toyota", "Honda"],
            ["Apple", "Samsung", "Google", "Microsoft", "Amazon"],
            ["Red", "Green", "Blue", "Yellow", "Purple"]
        );
        justArrays.forEach(function(element){
            console.log(element);   
        });

        console.log(justArrays[0][1].toUpperCase());
        console.log(justArrays[0].length);

        
    </script>

    
    
</body>
</html>
