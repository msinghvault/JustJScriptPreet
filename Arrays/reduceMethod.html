<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reduce Method in Array</title>
</head>

<body>
    <script>
        var reduceArray = new Array(10, 20, 30, 40, 50);
        console.log(reduceArray);

        var totalOfreduceArray = reduceArray.reduce(function (total, value) {
            return total + value;
        });
        console.log("Total of value present in the reduceArray is: " + totalOfreduceArray);
        var multiplyOfreduceArray = reduceArray.reduce(function (a, b) {
            return a * b;
        });
        console.log("Multiplication of value present in the reduceArray is: " + multiplyOfreduceArray);
    </script>
</body>

</html>
