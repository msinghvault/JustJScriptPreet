<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Example5</title>
</head>

<body>
    <script>
        var numbersArray = new Array("1", "2", "3", "4", "5", "6", "7", "8", "34", "65", "23", "56", "78", "90");
        console.log(numbersArray);

        console.log(numbersArray.reduce((a, b) => parseInt(a) + parseInt(b))); // adds all the elements of the array and returns the sum
    </script>

</body>

</html>
