<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects Document</title>
</head>

<body>
    <script>
        // defaults object
        var person1 = {};
        console.log(person1);

        //built-in objects
        var person2 = new Object();
        console.log(person2);

        // constructor Function - ES5
        function Student(){}
        var person3 = new Student();
        console.log(person3);

        // ES6 class syntax
        class Employee{}
        var person4= new Employee();
        console.log(person4)

    </script>
</body>

</html>
